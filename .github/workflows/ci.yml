name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.scope.outputs.code }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/okf
            ~/.cargo/bin/actionlint
          key: tools-${{ runner.os }}-${{ hashFiles('scripts/tool-versions.sh') }}
      - run: sudo apt-get update && sudo apt-get install -y shellcheck ripgrep
      - run: bash scripts/install-check-tools.sh
      - id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          code=true
          if [ "$EVENT" = pull_request ]; then
            merge_base=$(git merge-base "$BASE" "$HEAD")
            if ! git diff --name-only "$merge_base" "$HEAD" | rg -qv '^(docs/|openspec/|README.md$|CHANGELOG.md$|AGENTS.md$|CLAUDE.md$)'; then
              code=false
            fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
      - run: bash scripts/preflight.sh docs
      - run: bash scripts/preflight.sh scripts
      - run: bash scripts/preflight.sh specs
      - name: PR contract and OpenSpec completion
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          pattern='^(feat|fix|docs|refactor|perf|test|build|ci|chore|revert)(\([^)]+\))?!?: .+'
          [[ "$PR_TITLE" =~ $pattern ]] || { echo 'Use a Conventional Commit PR title'; exit 1; }
          ids=$(printf '%s\n' "$PR_BODY" | sed -n 's/^OpenSpec changes: *//p' | tr -d '\r')
          test -n "$ids" || { echo 'Declare OpenSpec changes: none or comma-separated IDs'; exit 1; }
          bash scripts/openspec-gate.sh "$BASE" "$HEAD" "$ids"

  rust:
    needs: checks
    if: needs.checks.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - run: |
          source scripts/tool-versions.sh
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt,clippy
      - run: bash scripts/preflight.sh rust

  msrv:
    needs: checks
    if: needs.checks.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: msrv-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'scripts/tool-versions.sh') }}
      - run: |
          source scripts/tool-versions.sh
          rustup toolchain install "$RUST_MSRV" --profile minimal
      - run: bash scripts/preflight.sh msrv

  platform:
    needs: checks
    if: needs.checks.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: platform-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - run: |
          source scripts/tool-versions.sh
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup run "$RUST_TOOLCHAIN" cargo test --locked --test interactive_output --quiet

  elasticsearch:
    needs: checks
    if: needs.checks.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: live-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - run: |
          source scripts/tool-versions.sh
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          docker compose -f tests/fixtures/elasticsearch/docker-compose.yml up -d --wait
          bash tests/fixtures/elasticsearch/fixture-setup.sh
          rustup run "$RUST_TOOLCHAIN" cargo test --locked --features elasticsearch --test elasticsearch_live -- --ignored
        env:
          TVIEW_ELASTICSEARCH_URL: http://localhost:19200
      - name: Retain service diagnostics
        if: failure()
        run: docker compose -f tests/fixtures/elasticsearch/docker-compose.yml logs
      - name: Stop fixture
        if: always()
        run: docker compose -f tests/fixtures/elasticsearch/docker-compose.yml down -v

  compliance:
    name: Compliance
    if: always()
    needs: [checks, rust, msrv, platform, elasticsearch]
    runs-on: ubuntu-24.04
    steps:
      - env:
          CHECKS: ${{ needs.checks.result }}
          CODE: ${{ needs.checks.outputs.code }}
          RUST: ${{ needs.rust.result }}
          MSRV: ${{ needs.msrv.result }}
          PLATFORM: ${{ needs.platform.result }}
          ELASTICSEARCH: ${{ needs.elasticsearch.result }}
        run: |
          test "$CHECKS" = success
          if [ "$CODE" = true ]; then
            test "$RUST" = success
            test "$MSRV" = success
            test "$PLATFORM" = success
            test "$ELASTICSEARCH" = success
          fi
